services:
  onionoo-fastapi:
    build: .
    image: onionoo-fastapi:latest
    ports:
      - "${HOST_PORT:-8000}:8000"
    environment:
      ONIONOO_BASE_URL: "https://onionoo.torproject.org"
      LOG_FORMAT: "${LOG_FORMAT:-json}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      METRICS_ENABLED: "${METRICS_ENABLED:-true}"
      # Comma-separated allowlist for browser-side callers. Deliberately left with
      # no value: Compose then passes it through only when the host environment
      # sets it, and the app default (the docs site plus localhost) applies
      # otherwise. Writing "${CORS_ALLOW_ORIGINS:-...}" instead would make
      # CORS_ALLOW_ORIGINS="" fall back to the default, so there would be no way
      # to switch CORS off from the environment.
      CORS_ALLOW_ORIGINS:
      RATE_LIMIT_ENABLED: "${RATE_LIMIT_ENABLED:-false}"
      RATE_LIMIT_PER_MINUTE: "${RATE_LIMIT_PER_MINUTE:-120}"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz').read()",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
