[project]
name = "onionoo-fastapi"
version = "1.1.0"
description = "FastAPI-based semantic/OpenAPI proxy for Tor Onionoo."
readme = "README.md"
requires-python = ">=3.13"
license = { file = "LICENSE" }
dependencies = [
  "cachetools>=5.3",
  # Upper bound is a compatibility hold, not a preference. FastAPI 0.137 stopped
  # flattening `include_router` routes into `app.routes` and now keeps a private
  # `_IncludedRouter` wrapper there instead. SlowAPI's `_find_route_handler` only
  # scans the top level for objects with an `.endpoint`, so from 0.137 it resolves
  # `None` for every `/v1/*` route, and `_should_exempt(None)` returns True. Rate
  # limiting then silently passes every request through: it fails open, with no
  # log line. Verified by bisection (0.136 fine, 0.137 broken) and guarded by
  # tests/test_rate_limit.py. Lift once SlowAPI handles the nested router layout.
  "fastapi[standard]>=0.110,<0.137",
  "fastapi-mcp>=0.4",
  "httpx>=0.27",
  "prometheus-fastapi-instrumentator>=7.0",
  "pydantic-settings>=2.2",
  "slowapi>=0.1.9",
  "structlog>=24.1",
  "tenacity>=8.3",
  "uvicorn[standard]>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project.scripts]
onionoo-mcp = "app.mcp_stdio:main"

[project.urls]
Repository = "https://github.com/anoni-net/onionoo-fastapi"
Issues = "https://github.com/anoni-net/onionoo-fastapi/issues"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

# Dev tooling lives in a PEP 735 dependency group rather than
# [project.optional-dependencies] so it doesn't leak into the published wheel.
# uv picks this up automatically via `uv sync` (and `uv sync --all-extras`
# stays a no-op for these now).
[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
  "ruff>=0.6",
]

