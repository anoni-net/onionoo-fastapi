[project]
name = "onionoo-fastapi"
version = "0.1.0"
description = "FastAPI-based semantic/OpenAPI proxy for Tor Onionoo."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
  "cachetools>=5.3",
  "fastapi[standard]>=0.110",
  "fastapi-mcp>=0.4",
  "httpx>=0.27",
  "prometheus-fastapi-instrumentator>=7.0",
  "pydantic-settings>=2.2",
  "slowapi>=0.1.9",
  "structlog>=24.1",
  "tenacity>=8.3",
  "uvicorn[standard]>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project.scripts]
onionoo-mcp = "app.mcp_stdio:main"

[project.urls]
Repository = "https://github.com/anoni-net/onionoo-fastapi"
Issues = "https://github.com/anoni-net/onionoo-fastapi/issues"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

# Dev tooling lives in a PEP 735 dependency group rather than
# [project.optional-dependencies] so it doesn't leak into the published wheel.
# uv picks this up automatically via `uv sync` (and `uv sync --all-extras`
# stays a no-op for these now).
[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
  "ruff>=0.6",
]

